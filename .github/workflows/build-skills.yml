name: Build skill zips

# Keeps the downloadable .zip for each skill in step with its source folder.
#
#   - On a pull request: fails if a zip is out of date, so drift can't merge.
#   - On a push to main: rebuilds the zips and commits them back automatically,
#     so editing a SKILL.md in the GitHub web UI is all you ever have to do.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check zips are up to date
        if: github.event_name == 'pull_request'
        run: ./build.sh --check

      - name: Rebuild zips
        if: github.event_name != 'pull_request'
        run: ./build.sh

      - name: Commit any rebuilt zips
        if: github.event_name != 'pull_request'
        run: |
          if [[ -z "$(git status --porcelain -- '*.zip')" ]]; then
            echo "Zips already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.zip'
          git commit -m "Rebuild skill zips from source folders"
          git push
